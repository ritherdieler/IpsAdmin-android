plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
}

apply from: "${rootProject.projectDir}/gradle/secrets.gradle"

def localProps = loadLocalProperties(rootProject)
def sendCloudMessagingApiKey = propOrEnv(localProps, "SEND_CLOUD_MESSAGING_API_KEY")
def obsApiKeyProd = resolveProdObsApiKey(localProps)
def mapsApiKeyDev = resolveMapsApiKey(localProps, file("src/dev/google-services.json"))
def mapsApiKeyProd = resolveMapsApiKey(localProps, file("src/prod/google-services.json"))
if (mapsApiKeyDev.isEmpty() || mapsApiKeyProd.isEmpty()) {
    logger.warn("Maps API key missing in google-services.json or MAPS_API_KEY; Google Maps tiles will not load.")
}


secrets {
    propertiesFileName = "local.properties"
    defaultPropertiesFileName = "local.defaults.properties"
    ignoreList.add("sdk.*")
    ignoreList.add("gpr.user")
    ignoreList.add("gpr.key")
    ignoreList.add("OBS_API_KEY")
    ignoreList.add("OBS_API_KEY_ANDROID")
    ignoreList.add("MAPS_API_KEY")
}

android {
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId "com.dscorp.ispadmin"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 60
        versionName "2.6.8"
        testInstrumentationRunner "com.dscorp.ispadmin.test.InstrumentationTestRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders += [MAPS_API_KEY: mapsApiKeyDev]
            buildConfigField "boolean", "HAS_MAPS_API_KEY", (!mapsApiKeyDev.isEmpty()).toString()
            buildConfigField 'boolean', 'SKIP_VERSION_CHECK', 'true'
            buildConfigField 'String', "FIRE_BASE_URL", '"https://fcm.googleapis.com"'
            buildConfigField 'String', "BASE_URL", '"http://192.168.1.4:8080/ispadmin/"'
            buildConfigField 'String', "OBS_BASE_URL", '"http://192.168.1.4:8080/ispadmin/"'
            buildConfigField 'String', "OBS_API_KEY", '"dev-obs-android-key"'
            buildConfigField 'String', "OBS_API_KEY_ANDROID", '""'
            buildConfigField 'String', "SEND_CLOUD_MESSAGING_API_KEY", "\"${sendCloudMessagingApiKey}\""
        }
        prod {
            dimension "environment"
            manifestPlaceholders += [MAPS_API_KEY: mapsApiKeyProd]
            buildConfigField "boolean", "HAS_MAPS_API_KEY", (!mapsApiKeyProd.isEmpty()).toString()
            buildConfigField 'boolean', 'SKIP_VERSION_CHECK', 'false'
            buildConfigField 'String', "FIRE_BASE_URL", '"https://fcm.googleapis.com"'
            buildConfigField 'String', "BASE_URL", '"https://api.gigafiberperu.cloud/ispadmin/"'
            buildConfigField 'String', "OBS_BASE_URL", '"https://api.gigafiberperu.cloud/ispadmin/"'
            buildConfigField 'String', "OBS_API_KEY", "\"${obsApiKeyProd}\""
            buildConfigField 'String', "OBS_API_KEY_ANDROID", "\"${obsApiKeyProd}\""
            buildConfigField 'String', "SEND_CLOUD_MESSAGING_API_KEY", "\"${sendCloudMessagingApiKey}\""
        }
        staging {
            dimension "environment"
            manifestPlaceholders += [MAPS_API_KEY: mapsApiKeyProd]
            buildConfigField "boolean", "HAS_MAPS_API_KEY", (!mapsApiKeyProd.isEmpty()).toString()
            buildConfigField 'boolean', 'SKIP_VERSION_CHECK', 'false'
            buildConfigField 'String', "FIRE_BASE_URL", '"https://fcm.googleapis.com"'
            buildConfigField 'String', "BASE_URL", '"https://api.gigafiberperu.cloud/ispadmin-staging/"'
            buildConfigField 'String', "OBS_BASE_URL", '"https://api.gigafiberperu.cloud/ispadmin-staging/"'
            buildConfigField 'String', "OBS_API_KEY", "\"${obsApiKeyProd}\""
            buildConfigField 'String', "OBS_API_KEY_ANDROID", "\"${obsApiKeyProd}\""
            buildConfigField 'String', "SEND_CLOUD_MESSAGING_API_KEY", "\"${sendCloudMessagingApiKey}\""
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            manifestPlaceholders += [usesCleartext: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.jvmTarget
    }

    sourceSets {
        dev {
            java.srcDirs = ['src/dev/java']
            res.srcDirs = ['src/dev/res']
            assets.srcDirs = ['src/dev/assets']
        }
        prod {
            java.srcDirs = ['src/prod/java']
            res.srcDirs = ['src/prod/res']
            assets.srcDirs = ['src/prod/assets']
        }
        staging {
            java.srcDirs = ['src/prod/java']
            res.srcDirs = ['src/prod/res']
            assets.srcDirs = ['src/prod/assets']
        }
        test {
            resources {
                srcDirs 'src\\test\\assets'
            }
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion rootProject.ext.composeCompilerVersion
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    namespace 'com.dscorp.ispadmin'
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':observability')
    implementation project(':domain')
    implementation project(':data')

    // Accompanist
    implementation "com.google.accompanist:accompanist-permissions:${rootProject.ext.accompanistVersion}"
    
    // AndroidX Core
    implementation "androidx.core:core-ktx:${rootProject.ext.coreKtxVersion}"
    implementation "androidx.appcompat:appcompat:${rootProject.ext.appCompatVersion}"
    implementation "androidx.constraintlayout:constraintlayout:${rootProject.ext.constraintLayoutVersion}"
    implementation "androidx.legacy:legacy-support-v4:${rootProject.ext.legacySupportVersion}"
    implementation "androidx.recyclerview:recyclerview:${rootProject.ext.recyclerViewVersion}"

    // AndroidX Biometric: muestra el prompt nativo para iniciar sesion con huella digital.
    implementation "androidx.biometric:biometric:1.1.0"
    // CameraX para preview nativo del reconocimiento facial
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    // ML Kit bundled: detecta rostros localmente sin esperar descargas externas.
    implementation "com.google.mlkit:face-detection:16.1.7"
    // Lifecycle y ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-process:${rootProject.ext.lifecycleVersion}"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workVersion}"
    
    // Paging 3
    implementation "androidx.paging:paging-runtime-ktx:3.2.1"
    implementation "androidx.paging:paging-compose:3.2.1"
    
    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:${rootProject.ext.navigationVersion}"
    implementation "androidx.navigation:navigation-ui-ktx:${rootProject.ext.navigationVersion}"
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.navigationVersion}"
    implementation "androidx.navigation:navigation-runtime-ktx:${rootProject.ext.navigationVersion}"

    implementation("com.dscorp:components:1.0.1")

    // Koin para Compose
    implementation "io.insert-koin:koin-androidx-compose:${rootProject.ext.koinComposeVersion}"
    
    // Google Play Services
    implementation "com.google.android.gms:play-services-maps:${rootProject.ext.playServicesMapsVersion}"
    implementation "com.google.android.gms:play-services-location:${rootProject.ext.playServicesLocationVersion}"
 // Debugging de red con Chucker
     debugImplementation "com.github.chuckerteam.chucker:library:4.1.0"
     releaseImplementation "com.github.chuckerteam.chucker:library-no-op:4.1.0"
    // Retrofit y networking
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.okhttp3:logging-interceptor:${rootProject.ext.okhttpVersion}"
    implementation "com.squareup.retrofit2:converter-gson:${rootProject.ext.retrofitVersion}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    
    // Compose
    implementation "androidx.constraintlayout:constraintlayout-compose:${rootProject.ext.composeConstraintLayoutVersion}"
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.compose.material:material-icons-extended:${rootProject.ext.composeIconsVersion}"
    implementation "androidx.compose.ui:ui:${rootProject.ext.composeVersion}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.composeActivityVersion}"
    debugImplementation "androidx.compose.ui:ui-tooling:${rootProject.ext.composeVersion}"
    
    // Charts y gráficos
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // Procesamiento de imágenes
    implementation "androidx.exifinterface:exifinterface:${rootProject.ext.exifInterfaceVersion}"

    // Activity
    implementation "androidx.activity:activity-ktx:${rootProject.ext.composeActivityVersion}"
    
    // Herramientas de debug
    implementation "com.facebook.stetho:stetho:${rootProject.ext.stethoVersion}"
    
    // Firebase
    implementation "com.google.firebase:firebase-crashlytics-ktx:${rootProject.ext.firebaseCrashlyticsVersion}"
    implementation "com.google.firebase:firebase-analytics-ktx:${rootProject.ext.firebaseAnalyticsVersion}"
    implementation "com.google.firebase:firebase-messaging-ktx:${rootProject.ext.firebaseMessagingVersion}"
    //implementation "com.google.firebase:firebase-storage-ktx:${rootProject.ext.firebaseStorageVersion}"


    // Carga de imágenes con Coil
    implementation "io.coil-kt.coil3:coil-compose:${rootProject.ext.coilVersion}"
    implementation "io.coil-kt.coil3:coil-network-okhttp:${rootProject.ext.coilVersion}"
    
    // Componentes de UI
    implementation "com.facebook.shimmer:shimmer:${rootProject.ext.shimmerVersion}"
    implementation "com.airbnb.android:lottie:${rootProject.ext.lottieVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashscreenVersion}"
    
    // Kotlin Standard Library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    
    // Google Maps Compose
    implementation "com.google.maps.android:maps-compose:${rootProject.ext.composeMapVersion}"
    
    // Kotlin Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"
    
    // Test dependencies
    testImplementation "com.squareup.okhttp3:mockwebserver:${rootProject.ext.okhttpVersion}"
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation "androidx.test.ext:junit-ktx:${rootProject.ext.junitExtVersion}"
    androidTestImplementation "androidx.test:runner:${rootProject.ext.testRunnerVersion}"
    androidTestImplementation "androidx.test:rules:${rootProject.ext.testCoreVersion}"
    androidTestImplementation "androidx.test:core:${rootProject.ext.testCoreVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.espressoVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:${rootProject.ext.espressoVersion}"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation "com.google.truth:truth:${rootProject.ext.truthVersion}"
    testImplementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation "androidx.fragment:fragment-testing:${rootProject.ext.fragmentTestVersion}"
    testImplementation "org.robolectric:robolectric:${rootProject.ext.robolectricVersion}"
    testImplementation "org.mockito:mockito-inline:${rootProject.ext.mockitoVersion}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${rootProject.ext.coroutinesTestVersion}"
    testImplementation "androidx.test.espresso:espresso-contrib:${rootProject.ext.espressoVersion}"
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation "androidx.arch.core:core-testing:${rootProject.ext.archCoreTestingVersion}"
    testImplementation 'com.jakewharton.espresso:okhttp3-idling-resource:1.0.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation "io.mockk:mockk:1.13.9"
    testImplementation "io.insert-koin:koin-test:${rootProject.ext.koinVersion}"
    testImplementation "io.insert-koin:koin-test-junit4:${rootProject.ext.koinVersion}"
    testImplementation "com.google.truth:truth:${rootProject.ext.truthVersion}"
    testImplementation "androidx.test.ext:junit-ktx:${rootProject.ext.junitExtVersion}"
    testImplementation "androidx.test:core-ktx:${rootProject.ext.testCoreVersion}"
    testImplementation "androidx.test:runner:${rootProject.ext.testRunnerVersion}"
    testImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.espressoVersion}"
}

// AGP consistent resolution pins androidx.test.* from debugRuntimeClasspath
// (ui-test-manifest) onto androidTest; force a coherent Espresso-capable set.
configurations.configureEach { configuration ->
    configuration.resolutionStrategy {
        force(
            "androidx.test:monitor:1.7.1",
            "androidx.test:core:1.6.1",
            "androidx.test:core-ktx:1.6.1",
            "androidx.test:runner:1.6.2",
            "androidx.test:rules:1.6.1",
        )
    }
}

// Configuración para usar diferentes archivos google-services.json según el flavor
android.applicationVariants.all { variant ->
    def flavorName = variant.flavorName
    def googleServicesFile = "src/${flavorName}/google-services.json"
    if (!file(googleServicesFile).exists() && flavorName == "staging") {
        googleServicesFile = "src/prod/google-services.json"
    }
    
    if (file(googleServicesFile).exists()) {
        copy {
            from googleServicesFile
            into "."
        }
    }
}

// Tarea para aplicar ADB reverse a todos los dispositivos
tasks.register("adbReverseAll", Exec) {
    group = "android"
    description = "Aplica ADB reverse a todos los dispositivos conectados"
    commandLine "bash", "-c", "bash ../reverse-all.sh"
}

// Tarea para instalar y configurar ADB reverse automáticamente
tasks.register("debugWithReverse") {
    group = "android"
    description = "Instala la app dev debug y configura ADB reverse"
    dependsOn "adbReverseAll"
    
    doLast {
        println "✅ App instalada y ADB reverse configurado"
        println "🔗 URL: http://127.0.0.1:8080/"
    }
}

gradle.taskGraph.whenReady { graph ->
    def needsProdObsKey = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        (name.contains("prod") || name.contains("staging")) && !name.contains("dev") &&
            (name.contains("assemble") || name.contains("install") || name.contains("bundle") ||
                name.contains("compile") || name.contains("generate"))
    }
    if (needsProdObsKey && obsApiKeyProd.isEmpty()) {
        throw new GradleException(
            "Falta OBS_API_KEY_ANDROID en local.properties (mismo valor que OBS_API_KEY_ANDROID del backend en prod). " +
                "Opcional: ./scripts/sync-obs-android-key-from-prod.sh"
        )
    }
}
