<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets con error</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#b23a0e}a:hover{color:#8a2c0a}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f7fb; color: #10142b; font-family: 'Roboto Flex', system-ui, sans-serif">

  <header style="height: 64px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 4px">
    <h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 600">Tickets</h1>
    <button aria-label="Buscar ticket" style="width: 48px; height: 48px; border: 0; background: transparent; color: #10142b; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>

  <div role="tablist" aria-label="Estado de los tickets" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #c6cad8">
    <button role="tab" aria-selected="true" style="height: 48px; border: 0; background: transparent; color: #141d48; font: 600 14px 'Roboto Flex', sans-serif; box-shadow: inset 0 -3px 0 #141d48">Pendientes</button>
    <button role="tab" aria-selected="false" style="height: 48px; border: 0; background: transparent; color: #4a5068; font: 500 14px 'Roboto Flex', sans-serif">En curso</button>
    <button role="tab" aria-selected="false" style="height: 48px; border: 0; background: transparent; color: #4a5068; font: 500 14px 'Roboto Flex', sans-serif">Cerrados</button>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px; overflow: hidden; white-space: nowrap">
    <button aria-pressed="true" style="height: 32px; padding: 0 12px 0 8px; border: 0; border-radius: 8px; background: #dfe3ff; color: #141d48; display: flex; align-items: center; gap: 4px; font: 600 13px 'Roboto Flex', sans-serif; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg>Todos</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">▲ Alta</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">Media</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">Baja</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">No abonados</button>
  </div>

  <div role="alert" style="position: absolute; left: 0; right: 0; top: 169px; bottom: 80px; padding: 0 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
    <span style="width: 64px; height: 64px; border-radius: 999px; background: #ffdad6; color: #ba1a1a; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg></span>
    <h2 style="margin: 16px 0 0; font-size: 18px; line-height: 24px; font-weight: 600">No se pudieron cargar los tickets</h2>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: #4a5068">Revisa tu conexión y vuelve a intentar.</p>
    <button style="margin-top: 24px; height: 48px; padding: 0 24px 0 20px; border: 0; border-radius: 999px; background: #141d48; color: #ffffff; display: flex; align-items: center; gap: 8px; font: 600 15px 'Roboto Flex', sans-serif" data-destino="a-tic-01-lista.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Reintentar</button>
    <span style="margin-top: 12px; font-size: 12px; line-height: 16px; color: #4a5068">Último intento 10:42</span>
  </div>

  <button style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px 0 16px; border: 0; border-radius: 16px; background: #ff5722; color: #2a0c00; display: flex; align-items: center; gap: 8px; font: 600 15px 'Roboto Flex', sans-serif; box-shadow: 0 2px 6px rgba(16,20,43,0.18)" data-destino="a-tic-05-crear.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #ffffff; border-top: 1px solid #e3e7f0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="a-ini-02-secretaria.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4a5068"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span><span style="font-size: 12px">Inicio</span></a>
    <a href="a-sus-02-inicial.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4a5068"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 4.5a4 4 0 0 1 0 7M22 21c0-3-1.8-5.5-4.5-6.5"/></svg></span><span style="font-size: 12px">Suscripciones</span></a>
    <a href="a-caj-01-caja.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4a5068"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M16 14.5h2"/></svg></span><span style="font-size: 12px">Caja</span></a>
    <a href="a-tic-01-lista.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #141d48"><span style="width: 64px; height: 32px; border-radius: 999px; background: #dfe3ff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/></svg></span><span style="font-size: 12px; font-weight: 600">Tickets</span></a>
    <a href="a-mas-01-menu.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #4a5068"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span style="font-size: 12px">Más</span></a>
  </nav>
</div>
<script src="flujos.js"></script>
<script src="navegacion.js"></script>
</body>
</html>
