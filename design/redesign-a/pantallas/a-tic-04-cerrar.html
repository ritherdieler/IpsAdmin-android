<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerrar ticket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#b23a0e}a:hover{color:#8a2c0a}
</style>
</head>
<body>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #f6f7fb; color: #10142b; font-family: 'Roboto Flex', system-ui, sans-serif">

  <header style="height: 64px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="a-tic-03-en-curso.html" aria-label="Cerrar" style="width: 48px; height: 48px; color: #10142b; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cerrar ticket #3606</h1>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 20px">

    <div style="font-size: 13px; line-height: 18px; color: #4a5068">Internet lento · Elena Flores Ríos · La Merced</div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="lbl-solucion" style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Solución *</span>
      <div role="radiogroup" aria-labelledby="lbl-solucion" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; color: #10142b; font: 500 14px/18px 'Roboto Flex', sans-serif">Reinicio de ONU</button>
        <button role="radio" aria-checked="true" style="min-height: 56px; padding: 9px 12px 9px 13px; border: 2px solid #141d48; border-radius: 16px; background: #f1f3f9; text-align: left; color: #141d48; font: 600 14px/18px 'Roboto Flex', sans-serif; display: flex; align-items: center; justify-content: space-between; gap: 8px">Ajuste de Wi-Fi<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12.5 10 17l9-10"/></svg></button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; color: #10142b; font: 500 14px/18px 'Roboto Flex', sans-serif">Cambio de conector</button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; color: #10142b; font: 500 14px/18px 'Roboto Flex', sans-serif">Reubicación del router</button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; color: #10142b; font: 500 14px/18px 'Roboto Flex', sans-serif">Instalación de repetidor</button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; color: #10142b; font: 500 14px/18px 'Roboto Flex', sans-serif">Otra</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Orden firmada *</span>
      <div style="display: flex; gap: 16px; align-items: center">
        <span role="img" aria-label="Foto de la orden de servicio firmada" style="width: 120px; height: 120px; flex-shrink: 0; border-radius: 12px; background: #e3e7f0; color: #4a5068; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #17663d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg>Foto lista</span>
          <span style="font-size: 13px; line-height: 18px; color: #4a5068">Tomada 10:46</span>
          <button style="margin-top: 6px; height: 40px; padding: 0 16px 0 12px; border: 1px solid #767c93; border-radius: 999px; background: transparent; color: #141d48; font: 600 14px 'Roboto Flex', sans-serif; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Repetir</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Fotos adicionales</span>
      <div style="display: flex; gap: 12px">
        <div style="position: relative; width: 120px; height: 120px; flex-shrink: 0">
          <span role="img" aria-label="Foto adicional 1: router" style="width: 120px; height: 120px; border-radius: 12px; background: #e3e7f0; color: #4a5068; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M17 13V7M14 9a4 4 0 0 1 6 0"/></svg></span>
          <button aria-label="Quitar foto adicional 1" style="position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border: 0; border-radius: 999px; background: rgba(16,20,43,0.64); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <button aria-label="Agregar foto" style="width: 120px; height: 120px; flex-shrink: 0; box-sizing: border-box; border: 2px dashed #767c93; border-radius: 12px; background: transparent; color: #141d48; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Comentario</span>
      <textarea style="min-height: 88px; padding: 12px 14px; box-sizing: border-box; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px/22px 'Roboto Flex', sans-serif; color: #10142b; resize: none">Canal 2.4 GHz cambiado de 6 a 11.</textarea>
      <span style="display: flex; justify-content: flex-end; font-size: 12px; line-height: 16px; color: #4a5068; font-feature-settings: 'tnum'">33/300</span>
    </label>

    <div style="min-height: 64px; box-sizing: border-box; padding: 8px 16px; background: #ffffff; border-radius: 16px; display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 22px; font-weight: 500">Avisar al abonado por WhatsApp</span><span style="font-size: 12px; line-height: 16px; color: #4a5068">Elena Flores · 965 220 418</span></span>
      <button role="switch" aria-checked="true" aria-label="Avisar al abonado por WhatsApp" style="width: 52px; height: 32px; border: 0; border-radius: 999px; background: #141d48; position: relative; flex-shrink: 0"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 999px; background: #ffffff"></span></button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e3e7f0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 52px; border: 0; border-radius: 999px; background: #141d48; color: #ffffff; font: 600 16px 'Roboto Flex', sans-serif" data-destino="a-tic-01-lista.html">Cerrar ticket</button>
  </div>
</div>
<script src="flujos.js"></script>
<script src="navegacion.js"></script>
</body>
</html>
