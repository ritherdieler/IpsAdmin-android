<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro 3 · Wi-Fi y foto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#b23a0e}a:hover{color:#8a2c0a}
</style>
</head>
<body>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #f6f7fb; color: #10142b; font-family: 'Roboto Flex', system-ui, sans-serif">

  <header style="height: 64px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="a-ini-03-tecnico.html" aria-label="Cerrar registro" style="width: 48px; height: 48px; color: #10142b; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nueva suscripción</h1>
    <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #141d48">3 de 4</span>
  </header>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 16px">
    <span style="height: 4px; border-radius: 999px; background: #141d48"></span><span style="height: 4px; border-radius: 999px; background: #141d48"></span><span style="height: 4px; border-radius: 999px; background: #141d48"></span><span style="height: 4px; border-radius: 999px; background: #dce1ec"></span>
  </div>
  <ol aria-label="Pasos del registro" style="margin: 0; padding: 6px 16px 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 11px; line-height: 14px; color: #4a5068">
    <li>Equipo</li><li>Cliente</li><li aria-current="step" style="color: #141d48; font-weight: 600">Servicio</li><li>Revisión</li>
  </ol>

  <main style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div role="status" style="background: #d6f2e2; color: #10142b; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #ffffff; color: #17663d; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M17 13V7M14 9a4 4 0 0 1 6 0"/></svg></span>
      <div style="font-size: 14px; line-height: 20px; font-weight: 600">Equipo conectado con la gestión remota ✓ · <span style="font-family: 'Roboto Mono', monospace; font-weight: 500">2:10</span></div>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 18px; line-height: 24px; font-weight: 600">Wi-Fi</h2>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Nombre de red *</span>
      <input value="Mendoza_Fibra" autocapitalize="off" spellcheck="false" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b">
    </label>

    <div style="min-height: 56px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span id="sw-5ghz" style="font-size: 15px; line-height: 22px">Nombre distinto para 5 GHz</span>
        <span style="font-size: 12px; line-height: 16px; color: #4a5068">5 GHz usará Mendoza_Fibra_5G</span>
      </div>
      <button role="switch" aria-checked="false" aria-labelledby="sw-5ghz" style="width: 52px; height: 32px; border: 0; border-radius: 999px; background: #eaedf5; box-shadow: inset 0 0 0 2px #767c93; position: relative; flex-shrink: 0"><span style="position: absolute; left: 8px; top: 8px; width: 16px; height: 16px; border-radius: 999px; background: #767c93"></span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wifi-clave" style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Clave *</label>
      <div style="display: flex; align-items: center; gap: 4px">
        <div style="position: relative; flex-grow: 1; min-width: 0">
          <input id="wifi-clave" type="password" value="k7Rm2pQx9v" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 52px 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b; letter-spacing: 1px">
          <button aria-label="Mostrar clave" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #4a5068; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button style="height: 48px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #141d48; font: 600 15px 'Roboto Flex', sans-serif; flex-shrink: 0">Generar</button>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #4a5068">Mínimo 8 caracteres</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px">
      <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Foto de fachada *</h2>
      <button style="height: 48px; padding: 0 18px 0 14px; border: 1px solid #767c93; border-radius: 999px; background: transparent; color: #141d48; font: 600 15px 'Roboto Flex', sans-serif; display: flex; align-items: center; gap: 8px; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Repetir foto</button>
    </div>
    <div role="img" aria-label="Foto de fachada tomada a las 10:51" style="width: 358px; height: 180px; box-sizing: border-box; border-radius: 12px; background: #e3e7f0; color: #4a5068; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      <span style="font-size: 13px; line-height: 18px; font-weight: 500">Tomada 10:51</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Observaciones</span>
      <textarea placeholder="Opcional" maxlength="300" style="width: 100%; min-height: 88px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px/22px 'Roboto Flex', sans-serif; color: #10142b; resize: none"></textarea>
      <span style="font-size: 12px; line-height: 16px; color: #4a5068; text-align: right; font-feature-settings: 'tnum'">0/300</span>
    </label>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e3e7f0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; line-height: 16px; color: #4a5068; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17663d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg>Todo listo</div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <a href="a-reg-03-servicio.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; color: #141d48; font-size: 15px; font-weight: 600; text-decoration: none">Atrás</a>
      <a href="a-reg-06-revision.html" style="height: 48px; padding: 0 32px; border-radius: 999px; background: #141d48; color: #ffffff; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Continuar</a>
    </div>
  </div>
</div>
<script src="flujos.js"></script>
<script src="navegacion.js"></script>
</body>
</html>
