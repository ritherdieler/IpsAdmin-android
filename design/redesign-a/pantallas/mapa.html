#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
path.enlace{fill:none;stroke:#0d99ff;stroke-width:2.5;vector-effect:non-scaling-stroke;marker-end:url(#flecha)}
path.auto{stroke-dasharray:8 6}circle.origen{fill:#0d99ff}
.toque{position:absolute;z-index:1;border:3px solid #0d99ff;border-radius:8px;background:rgba(13,153,255,.08);pointer-events:none}
.fuera{position:absolute;z-index:3;font:600 18px system-ui,sans-serif;background:#fff;border:2px solid #0d99ff;color:#0b6fc2;border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer}
