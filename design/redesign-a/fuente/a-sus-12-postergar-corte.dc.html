<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Postergar corte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#b23a0e}a:hover{color:#8a2c0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f7fb; color: #10142b; font-family: 'Roboto Flex', system-ui, sans-serif">

  <!-- Ficha de origen (María), simplificada detrás del scrim -->
  <div aria-hidden="true" style="background: #141d48; color: #ffffff; padding: 8px 16px 24px 4px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 4px">
    <div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
      <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
      <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-right: -12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></span>
    </div>
    <div style="padding-left: 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 24px; line-height: 30px; font-weight: 600">María Quispe Huamán</div>
      <div style="font-size: 14px; color: #b6bfe8">Cód. <span style="font-family: 'Roboto Mono', monospace; font-size: 13px">1907</span> · Fibra · La Villa</div>
      <div style="display: flex; gap: 8px; padding-top: 4px; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 8px; background: #d6f2e2; color: #17663d">Activo</span>
        <span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 8px; background: #ffdad6; color: #ba1a1a">Debe 1 mes</span>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16,20,43,0.52)"></div>

  <div role="dialog" aria-label="Postergar corte" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: #ffffff; border-radius: 28px 28px 0 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: center; padding-top: 12px"><span style="width: 32px; height: 4px; border-radius: 999px; background: #767c93"></span></div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Postergar corte</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #4a5068">María debe <span style="font-weight: 600; color: #10142b; font-feature-settings: 'tnum'">S/ 50.00</span> (set). Sin postergación, el corte de esta medianoche la deja sin internet.</p>
    </div>

    <div role="radiogroup" aria-label="Hasta cuándo" style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; line-height: 20px; font-weight: 600">Hasta cuándo</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-family: 'Roboto Flex', sans-serif; color: #10142b">
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">Vie 16 oct</span>
          <span style="font-size: 12px; line-height: 16px; color: #4a5068">en 2 días</span>
        </button>
        <button role="radio" aria-checked="true" style="min-height: 56px; padding: 9px 13px; border: 2px solid #141d48; border-radius: 16px; background: #f1f3f9; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: 'Roboto Flex', sans-serif; color: #10142b">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 20px; font-weight: 600">Lun 19 oct</span>
            <span style="font-size: 12px; line-height: 16px; color: #4a5068">en 5 días</span>
          </span>
          <span style="color: #141d48; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></span>
        </button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-family: 'Roboto Flex', sans-serif; color: #10142b">
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">Sáb 31 oct</span>
          <span style="font-size: 12px; line-height: 16px; color: #4a5068">fin de mes</span>
        </button>
        <button role="radio" aria-checked="false" style="min-height: 56px; padding: 10px 14px; border: 1px solid #c6cad8; border-radius: 16px; background: #ffffff; text-align: left; display: flex; align-items: center; gap: 10px; font-family: 'Roboto Flex', sans-serif; color: #10142b">
          <span style="color: #141d48; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">Elegir fecha</span>
        </button>
      </div>
    </div>

    <div role="radiogroup" aria-label="Motivo" style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; line-height: 20px; font-weight: 600">Motivo</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button role="radio" aria-checked="true" style="height: 32px; padding: 0 12px 0 8px; border: 0; border-radius: 8px; background: #dfe3ff; color: #141d48; font: 600 13px 'Roboto Flex', sans-serif; display: flex; align-items: center; gap: 4px; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg>Promesa de pago</button>
        <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">Viaje</button>
        <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">Reclamo en curso</button>
        <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border: 1px solid #767c93; border-radius: 8px; background: transparent; color: #10142b; font: 500 13px 'Roboto Flex', sans-serif; flex-shrink: 0">Otro</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Detalle (opcional)</span>
      <input value="Paga el lunes con Yape" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b">
    </label>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; line-height: 16px; color: #4a5068">Queda fuera del corte automático hasta el lun 19 oct inclusive.</div>
      <button style="height: 52px; border: 0; border-radius: 999px; background: #141d48; color: #ffffff; font: 600 15px 'Roboto Flex', sans-serif">Postergar hasta el lun 19 oct</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
