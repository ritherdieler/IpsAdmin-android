<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar titular</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;family=Roboto+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#b23a0e}a:hover{color:#8a2c0a}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #f6f7fb; color: #10142b; font-family: 'Roboto Flex', system-ui, sans-serif">

  <header style="height: 64px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="a-sus-04-ficha-resumen.dc.html" aria-label="Cerrar" style="width: 48px; height: 48px; color: #10142b; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Editar titular</h1>
    <button style="height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #141d48; font: 600 15px 'Roboto Flex', sans-serif">Guardar</button>
  </header>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px">

    <div style="border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; background: #dce6ff; color: #1b2e66">
      <span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: #ffffff; color: #2459c9; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
      <span style="font-size: 14px; line-height: 20px">Se aplica a los 2 servicios de este titular: <span style="font-weight: 600">Fibra · Basico</span> y <span style="font-weight: 600">Solo TV · Cable basico</span>.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Tipo de titular</span>
      <div role="radiogroup" aria-label="Tipo de titular" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #767c93; border-radius: 999px; overflow: hidden; height: 44px">
        <button role="radio" aria-checked="true" style="border: 0; background: #dfe3ff; color: #141d48; font: 600 14px 'Roboto Flex', sans-serif">✓ Persona</button>
        <button role="radio" aria-checked="false" style="border: 0; border-left: 1px solid #767c93; background: #ffffff; color: #10142b; font: 500 14px 'Roboto Flex', sans-serif">Empresa</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Nombres *</span>
        <input value="Jorge" autocomplete="given-name" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b">
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Apellidos *</span>
        <input value="Ramos Villanueva" autocomplete="family-name" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b">
      </label>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">DNI *</span>
          <input value="70418293" inputmode="numeric" maxlength="8" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b; font-feature-settings: 'tnum'">
          <span style="font-size: 12px; line-height: 16px; color: #4a5068">8 dígitos</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Teléfono *</span>
          <input value="987 654 321" type="tel" inputmode="tel" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b; font-feature-settings: 'tnum'">
          <span style="font-size: 12px; line-height: 16px; color: #4a5068">9 dígitos</span>
        </label>
      </div>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Email</span>
        <input type="email" value="" placeholder="correo@ejemplo.com" autocomplete="email" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b">
        <span style="font-size: 12px; line-height: 16px; color: #4a5068">Sin email registrado</span>
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Dirección *</span>
        <textarea rows="3" style="min-height: 88px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px/22px 'Roboto Flex', sans-serif; color: #10142b; resize: none">Jr. Los Pinos 214, frente a la losa deportiva</textarea>
        <span style="display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; color: #4a5068"><span>Calle, número y referencia</span><span style="font-feature-settings: 'tnum'">45/300</span></span>
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4a5068">Lugar *</span>
        <button aria-haspopup="listbox" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #767c93; border-radius: 12px; background: #ffffff; font: 400 16px 'Roboto Flex', sans-serif; color: #10142b; display: flex; justify-content: space-between; align-items: center; text-align: left">La Villa<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a5068" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </label>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e3e7f0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 52px; border: 0; border-radius: 999px; background: #141d48; color: #ffffff; font: 600 15px 'Roboto Flex', sans-serif">Guardar cambios</button>
  </div>
</div>
</x-dc>
