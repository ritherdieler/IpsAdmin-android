<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>body{margin:0;background:var(--background);color:var(--on-surface);font-family:var(--font-sans);padding:16px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap}
.b{font:600 12px/16px var(--font-sans);letter-spacing:.3px;border-radius:var(--radius-sm);padding:4px 8px;display:inline-flex;gap:4px;align-items:center}
.ok{background:var(--success-container);color:var(--success)}.wa{background:var(--warning-container);color:var(--warning)}.er{background:var(--error-container);color:var(--error)}.in{background:var(--info-container);color:var(--info)}.ne{background:var(--surface-container);color:var(--on-surface-variant)}
</style>
<div class="row"><span class="b ok">✓ Pagado</span><span class="b wa">◷ Por vencer</span><span class="b er">! Vencido</span><span class="b in">⇄ Migración</span><span class="b ne">Suspendido</span></div>
