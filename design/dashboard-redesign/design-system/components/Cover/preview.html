<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>
body{margin:0;background:var(--background)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--background)}
svg{position:absolute;inset:0}
.hero{fill:var(--hero)}.acc{fill:var(--accent)}.ter{fill:var(--tertiary)}.tint{fill:var(--primary-container)}.surf{fill:var(--surface)}
.arc{fill:none;stroke:var(--on-hero-muted);stroke-width:2}.arc.hot{stroke:var(--accent)}
.txt{position:absolute;left:48px;bottom:40px;max-width:440px}
.nm{font-family:var(--font-sans);font-weight:700;font-size:90px;line-height:.92;letter-spacing:-2px;color:var(--on-surface);margin:0}
.tg{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--on-surface-variant);margin:12px 0 0}
</style>
<div class="cv">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- blocks: hero 264x288 (bleeds top+bottom), accent 128x128, tertiary 128x144, primary-container 168x96; radius-md 16, radius-lg 28 -->
<!-- arrangement: one tall navy slab with satellites to its right, staggered on a 16px step -->
<!-- pattern: literal motif, fiber signal: 5 concentric quarter-arcs from the slab's corner, one in accent; chosen because the product runs a fiber network -->
<!-- steps: gaps 16 (space-4), arc pitch 24 (space-6), radii radius-md 16 / radius-lg 28 -->
<rect class="hero" x="512" y="-28" width="264" height="316" rx="28"/>
<g transform="translate(512,288)">
 <path class="arc" d="M0 -48 A48 48 0 0 1 48 0"/>
 <path class="arc" d="M0 -96 A96 96 0 0 1 96 0"/>
 <path class="arc hot" d="M0 -144 A144 144 0 0 1 144 0"/>
 <path class="arc" d="M0 -192 A192 192 0 0 1 192 0"/>
 <path class="arc" d="M0 -240 A240 240 0 0 1 240 0"/>
</g>
<rect class="acc" x="792" y="32" width="128" height="128" rx="16"/>
<rect class="ter" x="792" y="176" width="128" height="144" rx="16"/>
<rect class="tint" x="936" y="96" width="168" height="96" rx="16"/>
</svg>
<div class="txt"><h1 class="nm">IspAdmin</h1><p class="tg">Finanzas, suscriptores y red de fibra, de un vistazo.</p></div>
</div>
