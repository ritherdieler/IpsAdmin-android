<!-- @dsCard group="Inputs" height=170 subtitle="On surface and on the hero band" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>body{margin:0;background:var(--background);color:var(--on-surface);font-family:var(--font-sans);padding:16px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{font:600 12px/16px var(--font-sans);letter-spacing:.3px;border-radius:var(--radius-full);padding:8px 14px;border:1px solid transparent;background:var(--surface-container);color:var(--on-surface-variant);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hero{background:var(--hero);border-radius:var(--radius-md);padding:var(--space-4);margin-top:var(--space-4)}
.hero .chip{background:transparent;border-color:var(--on-hero-muted);color:var(--on-hero)}
.hero .chip[aria-pressed="true"]{background:var(--surface);color:var(--on-surface);border-color:var(--surface)}
</style>
<div class="row"><button class="chip" aria-pressed="true">✓ Este mes</button><button class="chip" aria-pressed="false">Mes anterior</button><button class="chip" aria-pressed="false">6 meses</button><button class="chip" aria-pressed="false">12 meses</button></div>
<div class="hero"><div class="row"><button class="chip" aria-pressed="true">✓ Este mes</button><button class="chip" aria-pressed="false">Mes anterior</button><button class="chip" aria-pressed="false">6 meses</button></div></div>
<script>document.querySelectorAll('.row').forEach(r=>r.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;r.querySelectorAll('.chip').forEach(c=>{c.setAttribute('aria-pressed',c===b);c.textContent=c.textContent.replace('✓ ','')});b.textContent='✓ '+b.textContent}))</script>
