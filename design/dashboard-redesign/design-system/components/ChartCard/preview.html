<!-- @dsCard group="Data display" height=330 subtitle="Two-series column chart, legend, direct label on the latest month" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>body{margin:0;background:var(--background);color:var(--on-surface);font-family:var(--font-sans);padding:16px}.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface-container-low);border-radius:var(--radius-md);padding:var(--space-4);max-width:380px;display:flex;flex-direction:column;gap:var(--space-3)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2)}
.t{font-size:15px;line-height:22px;font-weight:600}.s{font-size:12px;line-height:16px;color:var(--on-surface-variant)}
.a{font-size:12px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.lg{display:flex;gap:var(--space-4);font-size:12px;color:var(--on-surface-variant)}.lg span{display:flex;align-items:center;gap:6px}.sw{width:8px;height:8px;border-radius:2px}
.c1{fill:var(--primary)}.c2{fill:var(--tertiary)}.grid{stroke:var(--chart-grid);stroke-width:1}.ax{fill:var(--on-surface-variant);font-size:10px;font-family:var(--font-sans)}.vl{fill:var(--on-surface);font-size:10px;font-weight:600;font-family:var(--font-sans)}
</style>
