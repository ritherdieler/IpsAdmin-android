<style>body{margin:0;background:var(--background);color:var(--on-surface);font-family:var(--font-sans);padding:16px}.num{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:var(--space-3)}
.tile{background:var(--surface);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-1);box-shadow:var(--elevation-1)}
.lab{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.8px;color:var(--on-surface-variant);text-transform:uppercase}
.val{font-size:22px;line-height:28px;font-weight:650;letter-spacing:-.2px}
.d{font-size:12px;line-height:16px;font-weight:600}.up{color:var(--success)}.dn{color:var(--error)}.muted{color:var(--on-surface-variant);font-weight:400}
svg{display:block;margin-top:var(--space-2)}.ln{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ar{fill:var(--primary);opacity:.08}.dot{fill:var(--primary);stroke:var(--surface);stroke-width:2}
</style>
